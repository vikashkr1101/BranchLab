spring.application.name=branchlab-api
spring.datasource.url=${BRANCHLAB_DB_URL:jdbc:postgresql://localhost:${BRANCHLAB_DB_PORT:5432}/branchlab}
spring.datasource.username=${BRANCHLAB_DB_USER:branchlab}
spring.datasource.password=${BRANCHLAB_DB_PASSWORD:branchlab_local}
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
branchlab.jwt-secret=${BRANCHLAB_JWT_SECRET:}
branchlab.secure-cookies=${BRANCHLAB_SECURE_COOKIES:false}
