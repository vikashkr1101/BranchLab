services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: branchlab
      POSTGRES_USER: branchlab
      POSTGRES_PASSWORD: ${BRANCHLAB_DB_PASSWORD:-branchlab_local}
    ports:
      - "127.0.0.1:${BRANCHLAB_DB_PORT:-5432}:5432"
    volumes:
      - branchlab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchlab -d branchlab"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  branchlab_data:
